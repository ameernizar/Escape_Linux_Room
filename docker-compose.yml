services:
  api:
    build: ./backend
    env_file: .env
    environment:
      TERMINAL_WORKER_SOCKET: /run/escape-terminal/worker.sock
    volumes: ["./terminal-gateway-rootless/run:/run/escape-terminal:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escape
      POSTGRES_USER: escape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escape -d escape"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
